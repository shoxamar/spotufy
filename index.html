<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="/src/style.css">
  <!-- Иконки FontAwesome для кнопок управления -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="spotify-container">
    <!-- Боковая панель -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-spotify"></i> Spotify
      </div>
      <nav class="nav-links">
        <a href="#" class="active"><i class="fa-solid fa-house"></i> Главная</a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
        <a href="#"><i class="fa-solid fa-book"></i> Моя библиотека</a>
      </nav>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
      <h2>Популярные треки</h2>
      <div class="track-list" id="track-list">
        <!-- Список треков рендерится через JS -->
      </div>
    </main>
  </div>

  <!-- Панель плеера (снизу) -->
  <footer class="player">
    <div class="track-info">
      <img id="player-cover" src="https://via.placeholder.com/56" alt="Cover">
      <div>
        <div id="player-title" class="track-title">Выберите трек</div>
        <div id="player-artist" class="track-artist">-</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="buttons">
        <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button id="play-btn" class="play-pause"><i class="fa-solid fa-play"></i></button>
        <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-container">
      <i class="fa-solid fa-volume-high"></i>
      <input type="range" id="volume-bar" value="100" min="0" max="100">
    </div>
  </footer>

  <audio id="audio-element"></audio>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/counter.js"></script>

</body>
</html>
